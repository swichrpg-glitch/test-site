name: Fetch portfolio assets

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Behance assets
        run: |
          mkdir -p assets
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://mir-s3-cdn-cf.behance.net/projects/404/13c10e248938015.Y3JvcCwxOTIwLDE1MDEsMCww.png' -o assets/work01.png
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://mir-s3-cdn-cf.behance.net/projects/404/2d4629222489449.Y3JvcCwxNDAwLDEwOTUsMCww.png' -o assets/work02.png
          curl -L --fail --retry 3 -A 'Mozilla/5.0' 'https://mir-s3-cdn-cf.behance.net/projects/404/c51b02242112199.Y3JvcCwyNTYwLDIwMDIsMCww.png' -o assets/work03.png
          file assets/work01.png assets/work02.png assets/work03.png
          test -s assets/work01.png
          test -s assets/work02.png
          test -s assets/work03.png
      - name: Commit assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/work01.png assets/work02.png assets/work03.png
          if git diff --cached --quiet; then
            echo 'No asset changes.'
          else
            git commit -m 'Add local portfolio images'
            git push
          fi
